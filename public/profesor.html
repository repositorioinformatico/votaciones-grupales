<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del Profesor - Sistema de Encuestas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Pantalla de Login/Setup -->
    <div id="auth-screen" class="auth-screen">
        <div class="auth-box">
            <h1>🔐 Acceso Profesor</h1>
            <p id="auth-message">Ingresa la contraseña maestra</p>

            <div class="form-group">
                <input type="password" id="auth-password" placeholder="Contraseña" style="font-size: 1.1em; padding: 15px;">
            </div>

            <button onclick="handleAuth()" class="btn-primary" style="width: 100%;">Acceder</button>

            <p id="auth-error" style="color: #ef5350; margin-top: 15px; display: none;"></p>
        </div>
    </div>

    <div class="container" id="main-panel" style="display: none;">
        <header>
            <h1>📊 Panel del Profesor</h1>
            <button onclick="logout()" class="btn-secondary" style="float: right;">Cerrar Sesión</button>
        </header>

        <!-- Sección de crear encuesta -->
        <section class="create-survey">
            <h2>Crear Nueva Encuesta</h2>
            <div class="form-group">
                <label for="question">Pregunta de la encuesta:</label>
                <input type="text" id="question" placeholder="Ej: ¿Cuál es tu lenguaje de programación favorito?">
            </div>

            <div class="form-group">
                <label>Opciones de respuesta:</label>
                <div id="options-container">
                    <input type="text" class="option-input" placeholder="Opción 1">
                    <input type="text" class="option-input" placeholder="Opción 2">
                </div>
                <button onclick="addOption()" class="btn-secondary">+ Añadir opción</button>
            </div>

            <div class="form-group">
                <label for="max-votes">Número máximo de votos permitidos:</label>
                <input type="number" id="max-votes" placeholder="Ej: 8" min="1" value="8">
                <p style="color: #666; font-size: 0.9em; margin-top: 5px;">Cuando se alcance este número, no se permitirán más votos</p>
            </div>

            <button onclick="createSurvey()" class="btn-primary">Crear Encuesta</button>
        </section>

        <!-- Sección de encuesta activa -->
        <section class="active-survey" id="active-survey-section" style="display: none;">
            <h2>Encuesta Activa</h2>
            <div id="active-survey-content"></div>
        </section>

        <!-- Sección de historial -->
        <section class="surveys-history">
            <h2>Historial de Encuestas</h2>
            <div id="surveys-list"></div>
        </section>

        <!-- Sección de utilidades -->
        <section class="utilities">
            <button onclick="resetData()" class="btn-danger">🗑️ Limpiar todos los datos</button>
        </section>
    </div>

    <!-- Modal de Estadísticas -->
    <div id="stats-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close" onclick="closeStatsModal()">&times;</span>
            <h2>📊 Estadísticas Detalladas</h2>
            <div id="stats-content"></div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        let adminPassword = null; // Contraseña en memoria

        // ========== AUTENTICACIÓN ==========

        // Cargar estado de autenticación al iniciar
        window.addEventListener('DOMContentLoaded', async () => {
            await checkAuthStatus();
        });

        // Verificar si hay contraseña establecida
        async function checkAuthStatus() {
            try {
                const response = await fetch(`${API_URL}/api/auth/status`);
                const data = await response.json();

                if (!data.hasPassword) {
                    document.getElementById('auth-message').textContent = 'Establece una contraseña maestra (primera vez)';
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Manejar autenticación (login o setup)
        async function handleAuth() {
            const password = document.getElementById('auth-password').value;

            if (!password || password.length < 4) {
                showAuthError('La contraseña debe tener al menos 4 caracteres');
                return;
            }

            try {
                // Primero intentar login
                let response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                // Si falla, intentar setup (primera vez)
                if (!response.ok) {
                    response = await fetch(`${API_URL}/api/auth/setup`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password })
                    });
                }

                if (response.ok) {
                    adminPassword = password;
                    showMainPanel();
                } else {
                    const error = await response.json();
                    showAuthError(error.error || 'Error de autenticación');
                }
            } catch (error) {
                console.error('Error:', error);
                showAuthError('Error de conexión con el servidor');
            }
        }

        // Mostrar error de autenticación
        function showAuthError(message) {
            const errorEl = document.getElementById('auth-error');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            setTimeout(() => {
                errorEl.style.display = 'none';
            }, 3000);
        }

        // Mostrar panel principal
        function showMainPanel() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-panel').style.display = 'block';
            loadSurveys();
            // Actualizar cada 5 segundos
            setInterval(loadSurveys, 5000);
        }

        // Cerrar sesión
        function logout() {
            if (confirm('¿Estás seguro de cerrar sesión?')) {
                adminPassword = null;
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('main-panel').style.display = 'none';
                document.getElementById('auth-password').value = '';
            }
        }

        // Añadir header de autenticación a fetch
        function authFetch(url, options = {}) {
            if (!options.headers) {
                options.headers = {};
            }
            options.headers['x-admin-password'] = adminPassword;
            return fetch(url, options);
        }

        // ========== FIN AUTENTICACIÓN ==========

        // Añadir nueva opción
        function addOption() {
            const container = document.getElementById('options-container');
            const optionCount = container.querySelectorAll('.option-input').length + 1;
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'option-input';
            input.placeholder = `Opción ${optionCount}`;
            container.appendChild(input);
        }

        // Crear encuesta
        async function createSurvey() {
            const question = document.getElementById('question').value.trim();
            const maxVotes = parseInt(document.getElementById('max-votes').value);
            const optionInputs = document.querySelectorAll('.option-input');
            const options = Array.from(optionInputs)
                .map(input => input.value.trim())
                .filter(value => value !== '');

            if (!question) {
                alert('Por favor, ingresa una pregunta');
                return;
            }

            if (options.length < 2) {
                alert('Por favor, ingresa al menos 2 opciones');
                return;
            }

            if (!maxVotes || maxVotes < 1) {
                alert('Por favor, ingresa un número válido de votos máximos (mínimo 1)');
                return;
            }

            try {
                const response = await authFetch(`${API_URL}/api/surveys`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question, options, maxVotes })
                });

                if (response.ok) {
                    alert('✓ Encuesta creada y activada correctamente');

                    // Limpiar formulario
                    document.getElementById('question').value = '';
                    document.getElementById('max-votes').value = '8';
                    optionInputs.forEach(input => input.value = '');
                    loadSurveys();
                } else {
                    const error = await response.json();
                    alert(error.error || 'Error al crear la encuesta');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error de conexión con el servidor');
            }
        }

        // Cargar encuestas
        async function loadSurveys() {
            try {
                const response = await authFetch(`${API_URL}/api/surveys`);
                const surveys = await response.json();

                // Mostrar encuesta activa
                const activeSurvey = surveys.find(s => s.status === 'active');
                if (activeSurvey) {
                    showActiveSurvey(activeSurvey);
                } else {
                    document.getElementById('active-survey-section').style.display = 'none';
                }

                // Mostrar historial
                showSurveysHistory(surveys);
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Mostrar encuesta activa
        async function showActiveSurvey(survey) {
            const section = document.getElementById('active-survey-section');
            section.style.display = 'block';

            // Obtener resultados
            const response = await fetch(`${API_URL}/api/surveys/${survey.id}/results`);
            const data = await response.json();

            const totalVotes = data.totalVotes;
            const maxVotes = Math.max(...data.results.map(r => r.count), 1);

            let html = `
                <div class="survey-card active">
                    <h3>${survey.question}</h3>
                    <p class="survey-meta">Creada: ${new Date(survey.createdAt).toLocaleString()}</p>
                    <p class="survey-meta">Total de votos: ${totalVotes}</p>

                    <div class="results">
                        ${data.results.map(result => {
                            const percentage = totalVotes > 0 ? (result.count / totalVotes * 100).toFixed(1) : 0;
                            const barWidth = totalVotes > 0 ? (result.count / maxVotes * 100) : 0;
                            return `
                                <div class="result-item">
                                    <div class="result-label">${result.option}</div>
                                    <div class="result-bar-container">
                                        <div class="result-bar" style="width: ${barWidth}%"></div>
                                    </div>
                                    <div class="result-value">${result.count} votos (${percentage}%)</div>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <button onclick="showStats('${survey.id}')" class="btn-secondary">📊 Ver Estadísticas</button>
                    <button onclick="closeSurvey('${survey.id}')" class="btn-warning">Cerrar Encuesta</button>
                </div>
            `;

            document.getElementById('active-survey-content').innerHTML = html;
        }

        // Mostrar historial
        function showSurveysHistory(surveys) {
            const closedSurveys = surveys.filter(s => s.status === 'closed');
            const container = document.getElementById('surveys-list');

            if (closedSurveys.length === 0) {
                container.innerHTML = '<p class="no-data">No hay encuestas cerradas</p>';
                return;
            }

            container.innerHTML = closedSurveys.map(survey => `
                <div class="survey-card closed">
                    <h4>${survey.question}</h4>
                    <p class="survey-meta">Cerrada: ${new Date(survey.createdAt).toLocaleString()}</p>
                    <button onclick="showResults('${survey.id}')" class="btn-secondary">Ver Resultados</button>
                    <button onclick="showStats('${survey.id}')" class="btn-secondary">📊 Estadísticas</button>
                </div>
            `).join('');
        }

        // Cerrar encuesta
        async function closeSurvey(id) {
            if (!confirm('¿Estás seguro de cerrar esta encuesta?')) {
                return;
            }

            try {
                const response = await authFetch(`${API_URL}/api/surveys/${id}/close`, {
                    method: 'POST'
                });

                if (response.ok) {
                    alert('✓ Encuesta cerrada correctamente');
                    loadSurveys();
                } else {
                    alert('Error al cerrar la encuesta');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error de conexión con el servidor');
            }
        }

        // Ver resultados
        async function showResults(id) {
            try {
                const response = await fetch(`${API_URL}/api/surveys/${id}/results`);
                const data = await response.json();

                const totalVotes = data.totalVotes;
                let resultsText = `Encuesta: ${data.survey.question}\n\n`;
                resultsText += `Total de votos: ${totalVotes}\n\n`;

                data.results.forEach(result => {
                    const percentage = totalVotes > 0 ? (result.count / totalVotes * 100).toFixed(1) : 0;
                    resultsText += `${result.option}: ${result.count} votos (${percentage}%)\n`;
                });

                alert(resultsText);
            } catch (error) {
                console.error('Error:', error);
                alert('Error al obtener resultados');
            }
        }

        // Limpiar datos
        async function resetData() {
            if (!confirm('¿Estás seguro? Esto eliminará TODAS las encuestas y votos.')) {
                return;
            }

            try {
                const response = await authFetch(`${API_URL}/api/reset`, {
                    method: 'POST'
                });

                if (response.ok) {
                    alert('✓ Datos eliminados correctamente');
                    loadSurveys();
                } else {
                    alert('Error al eliminar datos');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error de conexión con el servidor');
            }
        }

        // Mostrar estadísticas detalladas
        async function showStats(surveyId) {
            try {
                const response = await authFetch(`${API_URL}/api/surveys/${surveyId}/stats`);
                const data = await response.json();

                if (!response.ok) {
                    alert('Error al obtener estadísticas');
                    return;
                }

                const maxVotes = data.survey.maxVotes || 0;

                let html = `
                    <h3>${data.survey.question}</h3>
                    <p><strong>Total de votos:</strong> ${data.totalVotes} / ${maxVotes}</p>
                    <p><strong>Creada:</strong> ${new Date(data.survey.createdAt).toLocaleString()}</p>
                    <p><strong>Estado:</strong> ${data.survey.status === 'active' ? 'Activa' : 'Cerrada'}</p>
                    <br>
                    <table class="stats-table">
                        <thead>
                            <tr>
                                <th>Opción Votada</th>
                                <th>IP</th>
                                <th>Fingerprint</th>
                                <th>Fecha/Hora</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                if (data.votes.length === 0) {
                    html += `
                        <tr>
                            <td colspan="4" style="text-align: center; color: #999;">No hay votos registrados</td>
                        </tr>
                    `;
                } else {
                    data.votes.forEach(vote => {
                        const date = new Date(vote.timestamp);
                        html += `
                            <tr>
                                <td><strong>${vote.option}</strong></td>
                                <td><code>${vote.ip}</code></td>
                                <td><code>${vote.fingerprint}</code></td>
                                <td>${date.toLocaleString()}</td>
                            </tr>
                        `;
                    });
                }

                html += `
                        </tbody>
                    </table>
                `;

                document.getElementById('stats-content').innerHTML = html;
                document.getElementById('stats-modal').style.display = 'block';

            } catch (error) {
                console.error('Error:', error);
                alert('Error de conexión con el servidor');
            }
        }

        // Cerrar modal de estadísticas
        function closeStatsModal() {
            document.getElementById('stats-modal').style.display = 'none';
        }

        // Cerrar modal al hacer clic fuera de él
        window.onclick = function(event) {
            const modal = document.getElementById('stats-modal');
            if (event.target == modal) {
                closeStatsModal();
            }
        }
    </script>
</body>
</html>
