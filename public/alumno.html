<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Votación de Alumnos - Sistema de Encuestas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container student-view">
        <header>
            <h1>🎓 Panel de Votación</h1>
            <p class="subtitle">Sistema de Encuestas - Alumnos</p>
        </header>

        <!-- Estado de conexión -->
        <div id="connection-status" class="status-indicator"></div>

        <!-- Contenedor principal -->
        <div id="main-content">
            <!-- Se llenará dinámicamente -->
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        let currentSurveyId = null;
        let hasVoted = false;

        // ANTI-FRAUDE: Verificar si ya votó en esta encuesta (localStorage)
        // Esta es la capa 2 de seguridad (capa 1 es el fingerprint en servidor)
        function hasVotedInSurvey(surveyId) {
            const votedSurveys = JSON.parse(localStorage.getItem('votedSurveys') || '[]');
            return votedSurveys.includes(surveyId);
        }

        // ANTI-FRAUDE: Registrar que votó en esta encuesta
        function markAsVoted(surveyId) {
            const votedSurveys = JSON.parse(localStorage.getItem('votedSurveys') || '[]');
            if (!votedSurveys.includes(surveyId)) {
                votedSurveys.push(surveyId);
                localStorage.setItem('votedSurveys', JSON.stringify(votedSurveys));
            }
        }

        // Cargar encuesta activa al iniciar
        window.addEventListener('DOMContentLoaded', () => {
            loadActiveSurvey();
            // Actualizar cada 3 segundos
            setInterval(loadActiveSurvey, 3000);
        });

        // Cargar encuesta activa
        async function loadActiveSurvey() {
            try {
                const response = await fetch(`${API_URL}/api/active-survey`);

                // Actualizar indicador de conexión
                updateConnectionStatus(true);

                if (!response.ok) {
                    showError('Error al cargar la encuesta');
                    return;
                }

                const survey = await response.json();

                if (!survey) {
                    showNoSurvey();
                    return;
                }

                // Si es una nueva encuesta, verificar localStorage
                if (currentSurveyId !== survey.id) {
                    currentSurveyId = survey.id;
                    hasVoted = hasVotedInSurvey(survey.id); // Verificar capa 2
                }

                showSurvey(survey);

            } catch (error) {
                console.error('Error:', error);
                updateConnectionStatus(false);
                showError('Error de conexión con el servidor');
            }
        }

        // Actualizar indicador de conexión
        function updateConnectionStatus(connected) {
            const indicator = document.getElementById('connection-status');
            if (connected) {
                indicator.className = 'status-indicator connected';
                indicator.innerHTML = '🟢 Conectado';
            } else {
                indicator.className = 'status-indicator disconnected';
                indicator.innerHTML = '🔴 Desconectado';
            }
        }

        // Mostrar encuesta
        function showSurvey(survey) {
            const content = document.getElementById('main-content');

            if (hasVoted) {
                showResults(survey);
                return;
            }

            let html = `
                <div class="survey-voting">
                    <h2>${survey.question}</h2>
                    <p class="survey-info">Selecciona una opción para votar</p>

                    <div class="voting-options">
                        ${survey.options.map((option, index) => `
                            <button
                                class="vote-option"
                                data-option="${option}"
                            >
                                <span class="option-letter">${String.fromCharCode(65 + index)}</span>
                                <span class="option-text">${option}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;

            content.innerHTML = html;

            // Agregar event listeners a los botones
            const voteButtons = document.querySelectorAll('.vote-option');
            voteButtons.forEach(button => {
                button.addEventListener('click', function(e) {
                    e.preventDefault();
                    const option = this.getAttribute('data-option');
                    this.blur(); // Eliminar el focus del botón
                    showConfirmModal(option);
                });
            });
        }

        // Mostrar modal de confirmación
        function showConfirmModal(option) {
            const modal = document.getElementById('confirm-modal');
            const message = document.getElementById('confirm-message');
            const confirmBtn = document.getElementById('confirm-yes');
            const cancelBtn = document.getElementById('confirm-no');

            message.textContent = option;
            modal.style.display = 'flex';

            // Eliminar listeners previos
            const newConfirmBtn = confirmBtn.cloneNode(true);
            const newCancelBtn = cancelBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirmBtn, confirmBtn);
            cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn);

            // Agregar nuevos listeners
            document.getElementById('confirm-yes').addEventListener('click', () => {
                hideConfirmModal();
                vote(option);
            });

            document.getElementById('confirm-no').addEventListener('click', hideConfirmModal);
        }

        // Ocultar modal de confirmación
        function hideConfirmModal() {
            const modal = document.getElementById('confirm-modal');
            modal.style.display = 'none';
        }

        // Votar
        async function vote(option) {
            // ANTI-FRAUDE: Verificar capa 2 (localStorage)
            if (hasVoted || hasVotedInSurvey(currentSurveyId)) {
                showAlert('Ya has votado en esta encuesta', 'warning');
                return;
            }

            // Mostrar indicador de carga
            showAlert('Enviando voto...', 'info');

            try {
                const response = await fetch(`${API_URL}/api/vote`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        surveyId: currentSurveyId,
                        option: option
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // ANTI-FRAUDE: Marcar como votado en ambas capas
                    hasVoted = true;
                    markAsVoted(currentSurveyId);
                    showAlert('✓ Voto registrado correctamente', 'success');
                    setTimeout(() => {
                        loadActiveSurvey(); // Recargar para mostrar resultados
                    }, 1000);
                } else {
                    // Si el servidor detectó voto duplicado, también marcar en cliente
                    if (data.code === 'ALREADY_VOTED') {
                        hasVoted = true;
                        markAsVoted(currentSurveyId);
                    }
                    showAlert(data.error || 'Error al registrar el voto', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('Error de conexión con el servidor', 'error');
            }
        }

        // Mostrar alerta personalizada
        function showAlert(message, type = 'info') {
            const alertDiv = document.getElementById('custom-alert');
            const alertMessage = document.getElementById('alert-message');
            const alertIcon = document.getElementById('alert-icon');

            // Iconos según tipo
            const icons = {
                success: '✓',
                error: '⚠️',
                warning: '⚠️',
                info: 'ℹ️'
            };

            alertIcon.textContent = icons[type] || icons.info;
            alertMessage.textContent = message;
            alertDiv.className = `custom-alert ${type}`;
            alertDiv.style.display = 'block';

            // Auto-ocultar después de 3 segundos (excepto para info)
            if (type !== 'info') {
                setTimeout(() => {
                    alertDiv.style.display = 'none';
                }, 3000);
            }
        }

        // Mostrar resultados después de votar
        function showResults(survey) {
            const content = document.getElementById('main-content');
            const totalVotes = survey.results.reduce((sum, r) => sum + r.count, 0);
            const maxVotes = Math.max(...survey.results.map(r => r.count), 1);

            let html = `
                <div class="survey-results">
                    <h2>✓ Voto Registrado</h2>
                    <h3>${survey.question}</h3>
                    <p class="survey-info">Resultados en tiempo real</p>
                    <p class="total-votes">Total de votos: ${totalVotes}</p>

                    <div class="results">
                        ${survey.results.map(result => {
                            const percentage = totalVotes > 0 ? (result.count / totalVotes * 100).toFixed(1) : 0;
                            const barWidth = totalVotes > 0 ? (result.count / maxVotes * 100) : 0;
                            return `
                                <div class="result-item">
                                    <div class="result-label">${result.option}</div>
                                    <div class="result-bar-container">
                                        <div class="result-bar" style="width: ${barWidth}%"></div>
                                    </div>
                                    <div class="result-value">${result.count} votos (${percentage}%)</div>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <p class="info-message">
                        Los resultados se actualizan automáticamente
                    </p>
                </div>
            `;

            content.innerHTML = html;
        }

        // Mostrar mensaje de no hay encuesta
        function showNoSurvey() {
            const content = document.getElementById('main-content');
            content.innerHTML = `
                <div class="no-survey">
                    <div class="icon">📊</div>
                    <h2>No hay encuestas activas</h2>
                    <p>Espera a que el profesor active una encuesta</p>
                    <div class="spinner"></div>
                </div>
            `;
        }

        // Mostrar error
        function showError(message) {
            const content = document.getElementById('main-content');
            content.innerHTML = `
                <div class="error-message">
                    <div class="icon">⚠️</div>
                    <h2>Error</h2>
                    <p>${message}</p>
                    <p class="retry-message">Reintentando...</p>
                </div>
            `;
        }
    </script>

    <!-- Modal de confirmación personalizado -->
    <div id="confirm-modal" class="confirm-modal">
        <div class="confirm-content">
            <h3>Confirmar voto</h3>
            <p>¿Confirmas tu voto por:</p>
            <p class="confirm-option" id="confirm-message"></p>
            <div class="confirm-buttons">
                <button id="confirm-yes" class="btn-confirm">Sí, votar</button>
                <button id="confirm-no" class="btn-cancel">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Alerta personalizada -->
    <div id="custom-alert" class="custom-alert">
        <span id="alert-icon"></span>
        <span id="alert-message"></span>
    </div>
</body>
</html>
